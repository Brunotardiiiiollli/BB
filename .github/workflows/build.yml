name: Build EXE

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt || echo "Falha ao instalar requirements.txt"
          pip install pyinstaller pillow pyttsx3 SpeechRecognition playsound || echo "Erro em libs"

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --onefile main.py || echo "Erro ao compilar"
          dir dist

      - name: Upload do EXE
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: sexta-feira
          path: dist/main.exe
