name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow pyttsx3 SpeechRecognition playsound

      - name: Build EXE
        run: |
          pyinstaller --onefile main.py
          dir dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: sexta-feira
          path: dist/main.exe

